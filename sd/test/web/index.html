<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yi Hack v2</title>
  <style>
    body { font: 16px sans-serif; max-width: 56rem; margin: 2rem auto; padding: 0 1rem; }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
    img { max-width: 100%; border: 1px solid #ccc; }
    button { padding: .5rem .8rem; margin-right: .5rem; }
    pre { background: #f4f4f4; padding: 1rem; white-space: pre-wrap; }
    .actions { margin: 1rem 0; }
    .muted { color: #666; font-size: .9rem; }
    .streams a { margin-right: 1rem; }
    fieldset { margin: 1rem 0; }
    label { display: block; margin: .5rem 0; }
  </style>
</head>
<body>
  <header>
    <h1>Yi Hack v2</h1>
    <span class="muted" id="updated">Connecting...</span>
  </header>
  <div class="actions">
    <button onclick="refreshStatus()">Refresh status</button>
    <button onclick="reboot()">Reboot camera</button>
  </div>
  <pre id="status">Loading...</pre>
  <h2>RTSP streams</h2>
  <p class="streams">
    <a id="mainStream" href="#" target="_blank">Main stream (stream1)</a>
    <a id="lowStream" href="#" target="_blank">Secondary stream (stream2)</a>
  </p>
  <h2>Settings</h2>
  <form action="cgi-bin/settings.sh" method="post">
    <fieldset>
      <legend>Startup services</legend>
      <label><input type="checkbox" name="rtsp" value="YES" checked> RTSP server</label>
      <label><input type="checkbox" name="http" value="YES" checked> Web interface after reboot</label>
      <label><input type="checkbox" name="ftp" value="YES" checked> FTP server</label>
      <label><input type="checkbox" name="telnet" value="YES" checked> Telnet server</label>
      <p class="muted">Unchecked services are disabled. RTSP and HTTP changes apply after reboot; FTP and Telnet apply immediately.</p>
    </fieldset>
    <fieldset>
      <legend>LEDs</legend>
      <label>Red:
        <select name="led_red"><option value="off">off</option><option value="on">on</option><option value="flash">flash</option></select>
      </label>
      <label>Green:
        <select name="led_green"><option value="off">off</option><option value="on">on</option><option value="flash">flash</option></select>
      </label>
      <label>Blue:
        <select name="led_blue"><option value="off">off</option><option value="on" selected>on</option><option value="flash">flash</option></select>
      </label>
    </fieldset>
    <button type="submit">Save settings</button>
  </form>
  <h2>Snapshot</h2>
  <p><button onclick="refreshSnapshot()">Capture now</button>
     <a id="download" href="#" download="yi-hack-snapshot.jpg">Download snapshot</a></p>
  <img id="snapshot" alt="Camera snapshot">
  <script>
    var snapshotUrl = 'cgi-bin/snapshot.sh';

    function refreshStatus() {
      fetch('cgi-bin/status.sh?t=' + Date.now()).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      }).then(function (text) {
        document.getElementById('status').textContent = text;
        document.getElementById('updated').textContent =
          'Updated ' + new Date().toLocaleTimeString();
      }).catch(function (error) {
        document.getElementById('status').textContent = 'Status unavailable: ' + error;
      });
    }
    function refreshSnapshot() {
      var url = snapshotUrl + '?t=' + Date.now();
      document.getElementById('snapshot').src = url;
      document.getElementById('download').href = url;
    }
    function reboot() {
      if (confirm('Reboot the camera?')) {
        fetch('cgi-bin/reboot.sh', { method: 'POST' })
          .then(function (r) {
            alert(r.ok ? 'Reboot requested.' : 'Reboot failed (' + r.status + ').');
          });
      }
      document.querySelector('form').addEventListener('submit', function (event) {
        event.preventDefault();
        var form = event.target;
        var data = new URLSearchParams(new FormData(form));
        ['rtsp', 'http', 'ftp', 'telnet'].forEach(function (name) {
          if (!form.elements[name].checked) data.set(name, 'NO');
        });
        fetch(form.action, { method: 'POST', body: data })
          .then(function (r) { return r.text().then(function (text) {
            alert(r.ok ? text : 'Settings failed (' + r.status + '): ' + text);
          }); });
      });
    }
    var host = window.location.hostname;
    document.getElementById('mainStream').href = 'rtsp://' + host + '/stream1';
    document.getElementById('lowStream').href = 'rtsp://' + host + '/stream2';
    refreshStatus();
    refreshSnapshot();
    window.setInterval(refreshStatus, 10000);
  </script>
</body>
</html>
